name: Whop membership completeness validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/whop-complete-membership-discovery

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate complete membership discovery and production build
        run: npm run build

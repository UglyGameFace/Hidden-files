name: Whop importer validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/whop-guide-importer

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate importer and Astro build
        run: npm run build
      - name: Capture deployment inventory
        shell: bash
        run: |
          find api -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort > api-files.txt
          printf 'api_function_count=%s\n' "$(wc -l < api-files.txt)" > deployment-inventory.txt
          cat api-files.txt >> deployment-inventory.txt
      - name: Upload deployment inventory
        uses: actions/upload-artifact@v4
        with:
          name: deployment-inventory
          path: deployment-inventory.txt
          if-no-files-found: error
          retention-days: 1

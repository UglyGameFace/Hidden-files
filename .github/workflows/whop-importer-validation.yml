name: Whop importer validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/whop-guide-importer

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate importer and Astro build
        run: npm run build
      - name: Capture Vercel packaging output
        shell: bash
        run: |
          set +e
          npx --yes vercel@latest build --yes > vercel-build.log 2>&1
          echo "$?" > vercel-build.status
          exit 0
      - name: Upload Vercel packaging output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-packaging-log
          path: |
            vercel-build.log
            vercel-build.status
          if-no-files-found: error
          retention-days: 1
      - name: Require Vercel packaging success
        shell: bash
        run: |
          cat vercel-build.log
          test "$(cat vercel-build.status)" = "0"

name: Whop importer validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/whop-guide-importer

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate importer and Astro build
        run: npm run build
      - name: Validate Vercel packaging
        run: npx --yes vercel@latest build --yes

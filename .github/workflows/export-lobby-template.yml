name: Export Lobby site template

on:
  push:
    branches:
      - agent/export-lobby-template

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lobby-site-template
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
            !.vercel/**
          include-hidden-files: true
          retention-days: 1
